# This file should contain all of the parameters for tests that are the same across machines.

photometry:
  campari:
    cutout_size: 11
    initial_flux_guess: 3000
    fetch_SED: false
    use_roman: true
    weighting: true
    make_initial_guess: true
    method: lsqr
    pixel: false
    subtract_background_method: calculate
    use_real_images: true
    print_memory_usage: false
    preplot_cutouts: true
    postplot_cutouts: true
    save_memory_file_name: "None"

    psf:
      galaxy_class: ou24PSF
      transient_class: ou24PSF_slow

    grid_options:
      type: contour
      percentiles:
      - 0
      - 90
      - 98
      - 100
      spacing: 0.75
      turn_grid_off: false
      gaussian_var: -1 # Gaussian weighting off by default
      cutoff: 4
      error_floor: 1.0
      subsize: 4


  snappl:
    simdex_server: https://roman-desc-simdex.rknop.net
