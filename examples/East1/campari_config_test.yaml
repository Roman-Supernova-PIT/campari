# # This is used for the ASDF podman container:
# preloads:
#   - ${SNPIT_DEFAULT_CONFIG}

# preloads:
#   - snpit_test_config.yaml

photometry:
  campari:
    cutout_size: 11
    initial_flux_guess: 3000
    fetch_SED: false
    use_roman: true
    weighting: true
    make_initial_guess: true
    method: lsqr
    pixel: false
    subtract_background_method: calculate
    use_real_images: true
    print_memory_usage: false
    preplot_cutouts: false
    save_memory_file_name: test_memory_file

    psf:
      galaxy_class: gaussian
      transient_class: gaussian

    grid_options:
      type: regular
      percentiles:
      - 0
      - 90
      - 98
      - 100
      spacing: 0.75
      turn_grid_off: false
      gaussian_var: -1 # Gaussian weighting off by default
      cutoff: 4
      error_floor: 0.0
      subsize: 4

  campari_io:
    output_dir: /home/cfmeldorf/campari_out_dir
    debug_dir: /home/cfmeldorf/campari_debug_dir
    save_debug: true
    test_num: 1
    # How do I de-hardcode this name for the directory?
    test_data: /home/cfmeldorf/packages/campari/campari_test_data
    # test_num is a hack suggested by Rob. If you want to save a lc to the database, it needs a provenance.
    # However, if a run successfully creates a provenance but does not successfully complete, the code will fail
    # because it tries to create a provenance that already exists. By iterating this dummy parameter, we can ensure
    # the provenance is new because the hash of this config file will change.
  campari_simulations:
    avoid_non_linearity: false
    background_level: 0
    bg_gal_flux: 100000.0
    deltafcn_profile: false
    do_rotation: true
    do_xshift: true
    mismatch_seds: false
    noise: 0
    sim_gal_dec_offset: 0.00001
    sim_gal_ra_offset: 0.00001
    single_grid_point: false
    sim_galaxy_scale: 1.0
    sim_galaxy_offset: .00001414 # sqrt(2) * 1e-5
    base_pointing: 276
    base_sca: 10
    run_name: whatever

  snappl:
    simdex_server: https://roman-desc-simdex.lbl.gov

  test_data: "/home/cfmeldorf/packages/photometry_test_data"

# Once we get the Apptainer on East1 this should be removed.
system:
  db:
    url: https://webserver:8080/
    username: test
    # In an actual config, you should set password to null
    #   and create a single-line text file with your
    #   password in a secure location.  Put the
    #   location of that file in password_file.
    password: test_password
    passwordfile: null

  # Paths on your system.  Most of these will need
  # to be changed when running somewhere else.
  paths:
    # Base directory where single-epoch 1d spectra are written
    spectra1d: /data/spectra1d

    # Base directory where all lightcurves saved to the database are stored
    lightcurves: /data/lightcurves

    # Base directory where all segmentation maps saved to the database are stored
    segmaps: /data/segmaps

    # Base directory where... at least some... sometimes... l2 images are stored
    images: /data/l2images

    # For basic temp usage
    temp_dir: /tmp

    # For stuff that's written out that we might want to look at later
    # but aren't formal data products
    dev_storage: /dev_storage

    # Paths used by snappl library modules
    snappl:
      A25ePSF_path: /packages/snappl/snappl/tests/testdata/A25ePSF

  ou24:
    simdex_server: https://roman-desc-simdex.lbl.gov

    tds_base: /home/cfmeldorf/packages/campari/examples/East1
    config_file: /home/cfmeldorf/packages/campari/examples/East1/tds.yaml

    sn_truth_dir: /home/cfmeldorf/packages/photometry_test_data/ou2024/snana_truth
    # sn_truth_dir: /snana_pq_dir

    images: /home/cfmeldorf/packages/photometry_test_data/ou2024/images/simple_model

    sims_sed_library: /home/cfmeldorf/packages/photometry_test_data/ou2024/sims_sed_library
    # Comment from Cole & Rob: This is a path to the SEDs that were used to generate the
    # OU24 simulations.  Only a subset of the files are stored in
    # photometry_test_data, so if you want to use it for real, you'll need
    # to get the file yourself.  If you are interested in getting the SEDs yourself,
    # go into the directory where you want it to live and run the command:
    # curl https://s3df.slac.stanford.edu/groups/rubin/static/sim-data/sed_library/seds_170124.tar.gz  | tar xv
    # Courtesy of M. Troxel ^^^
